<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1100" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#263238"/>
    </marker>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78838f"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #232f3e; }
      .sub   { font-size: 13px; fill: #5f6b7a; }
      .lbl   { font-size: 13px; font-weight: 600; fill: #232f3e; }
      .small { font-size: 11px; fill: #5f6b7a; }
