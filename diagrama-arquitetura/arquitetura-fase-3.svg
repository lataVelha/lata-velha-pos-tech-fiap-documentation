  <rect x="130" y="910" width="300" height="82" rx="10" fill="#fff" stroke="#FB8C00" stroke-width="1.5"/>
  <use href="#i-ec2" x="142" y="922" width="24" height="24"/>
  <text x="280" y="930" text-anchor="middle" class="lbl">EC2 t3.small · AZ-a</text>
