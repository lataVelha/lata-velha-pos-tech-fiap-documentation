  <text x="960" y="840" text-anchor="middle" class="small">repo infra-db</text>
  <text x="960" y="862" text-anchor="middle" class="small">Single-AZ · subnet privada</text>
  <text x="960" y="884" text-anchor="middle" class="small">SG: :5432 só da VPC</text>
  <text x="960" y="906" text-anchor="middle" class="small">sem acesso público</text>

