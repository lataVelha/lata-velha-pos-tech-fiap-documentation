  <text x="630" y="964" text-anchor="middle" fill="white" font-size="9.2" font-weight="600">api pod :8080 · PDB maxUnavailable 1</text>
  <text x="630" y="988" text-anchor="middle" class="small">Cluster Autoscaler: 1 → 4 nodes</text>

  <rect x="835" y="742" width="250" height="270" rx="12" fill="#e3f2fd" stroke="#1565C0" stroke-width="1.5"/>
  <use href="#i-rds" x="850" y="758" width="36" height="36"/>
